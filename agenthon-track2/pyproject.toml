[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agenthon-track2"
version = "1.0.1"
description = "Agenthon 2026 Track 2: reasoning-augmented probabilistic forecasting engine"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=16",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "jsonschema>=4.23"]

[project.scripts]
forecast = "agenthon.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agenthon = ["resources/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
